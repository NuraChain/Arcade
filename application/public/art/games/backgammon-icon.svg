<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 12 104 100">
    <defs>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C98547"/>
            <stop offset="0.5" stop-color="#9A5A26"/>
            <stop offset="1" stop-color="#6E3C14"/>
        </linearGradient>
        <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5A2F10"/>
            <stop offset="1" stop-color="#3A1D08"/>
        </linearGradient>
        <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F6EDD9"/>
            <stop offset="1" stop-color="#E4D3B0"/>
