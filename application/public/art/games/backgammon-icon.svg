        <rect x="-45" y="-33" width="90" height="62" rx="8" fill="url(#wood)"/>
        <path d="M-40 -24C-20 -26 10 -22 40 -25M-41 18C-15 16 12 20 41 17" fill="none" stroke="#E7B27A" stroke-width="0.8" opacity="0.35"/>
        <rect x="-39" y="-27" width="36" height="50" rx="2.5" fill="url(#field)"/>
        <rect x="3" y="-27" width="36" height="50" rx="2.5" fill="url(#field)"/>
        <g transform="translate(-37.5 -25.5)">
