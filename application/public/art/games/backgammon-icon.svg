        </g>
        <g id="points-bottom">
            <path d="M0 38H5.5L2.75 21Z" fill="#1F2937"/>
            <path d="M5.5 38H11L8.25 21Z" fill="#B91C1C"/>
            <path d="M11 38H16.5L13.75 21Z" fill="#1F2937"/>
            <path d="M16.5 38H22L19.25 21Z" fill="#B91C1C"/>
            <path d="M22 38H27.5L24.75 21Z" fill="#1F2937"/>
