<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 12 104 100">
    <defs>
        <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3B6FE0"/>
            <stop offset="1" stop-color="#172E7A"/>
        </linearGradient>
        <pattern id="lattice" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="7" height="7" fill="none"/>
            <path d="M0 0H7M0 0V7" stroke="#93C5FD" stroke-width="1" opacity="0.35"/>
        </pattern>
        <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#E4EAF3"/>
        </linearGradient>
        <linearGradient id="heart" x1="0" y1="0" x2="0.6" y2="1">
            <stop offset="0" stop-color="#FB7185"/>
            <stop offset="1" stop-color="#BE123C"/>
        </linearGradient>
        <radialGradient id="gloss" cx="0.25" cy="0.15" r="0.9">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>
        <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4"/>
        </filter>
        <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.45"/>
        </filter>
        <path id="heart-shape" d="M0 7.5C-1.2 6.4-12 -1.1-12 -7.6C-12 -12-8.6-15-5-15C-2.6-15-0.8-13.7 0-12C0.8-13.7 2.6-15 5-15C8.6-15 12-12 12-7.6C12-1.1 1.2 6.4 0 7.5Z"/>
    </defs>

    <ellipse cx="60" cy="104" rx="38" ry="6.5" fill="#000000" opacity="0.45" filter="url(#blur)"/>

    <g transform="translate(46 58) rotate(-15)" filter="url(#lift)">
        <rect x="-23" y="-32" width="46" height="64" rx="6" fill="url(#back)"/>
        <rect x="-19" y="-28" width="38" height="56" rx="3.5" fill="url(#lattice)"/>
        <rect x="-19" y="-28" width="38" height="56" rx="3.5" fill="none" stroke="#BFDBFE" stroke-width="1" opacity="0.55"/>
        <circle cx="0" cy="0" r="7.5" fill="#1E3A8A" stroke="#BFDBFE" stroke-width="1" opacity="0.9"/>
        <path d="M0 -4.2L3.2 0L0 4.2L-3.2 0Z" fill="#BFDBFE"/>
        <rect x="-23" y="-32" width="46" height="64" rx="6" fill="url(#gloss)"/>
    </g>

    <g transform="translate(72 60) rotate(9)" filter="url(#lift)">
        <rect x="-23" y="-32" width="46" height="64" rx="6" fill="url(#face)"/>
        <rect x="-22.5" y="-31.5" width="45" height="63" rx="5.5" fill="none" stroke="#CBD5E1" stroke-width="1"/>
        <text x="-15.5" y="-17" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#DC2626" text-anchor="middle">A</text>
        <use href="#heart-shape" fill="#DC2626" transform="translate(-15.5 -8) scale(0.32)"/>
        <use href="#heart-shape" fill="url(#heart)" transform="translate(1.5 7) scale(1.05)"/>
        <path d="M-9 -8.5C-8.6 -11.4-6.4 -12.8-4.2 -12.4" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" opacity="0.65" transform="translate(1.5 7) scale(1.05)"/>
        <g transform="rotate(180)">
            <text x="-15.5" y="-17" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#DC2626" text-anchor="middle">A</text>
            <use href="#heart-shape" fill="#DC2626" transform="translate(-15.5 -8) scale(0.32)"/>
        </g>
        <rect x="-23" y="-32" width="46" height="64" rx="6" fill="url(#gloss)"/>
    </g>
</svg>
