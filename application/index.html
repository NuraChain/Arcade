<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
        <title>Nura Games</title>
        <meta name="description" content="A social gaming world. Hokm, Ludo, Backgammon and Poker, played with the people you actually want to play them with."/>

        <meta name="theme-color" content="#0B1220"/>

        <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
        <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
        <link rel="manifest" href="/site.webmanifest"/>

        <meta property="og:type" content="website"/>
        <meta property="og:site_name" content="Nura Games"/>
        <meta property="og:title" content="Nura Games"/>
        <meta property="og:description" content="Sit down with the people you actually want to play with. Hokm, Ludo, Backgammon and Poker at real tables, with friends, groups and chat."/>
        <meta property="og:image" content="/share.jpg"/>
        <meta property="og:image:width" content="1200"/>
        <meta property="og:image:height" content="630"/>
        <meta name="twitter:card" content="summary_large_image"/>
        <link rel="stylesheet" href="/src/styles.css"/>

        <script>
            (function ()
            {
                var LOCALES = ['en', 'fa'];
                var RTL = ['fa'];
                var root = document.documentElement;

                function stored(key, allowed)
                {
                    try
                    {
                        var value = localStorage.getItem(key);
                        return allowed.indexOf(value) === -1 ? null : value;
                    }
                    catch (error)
                    {
                        return null;
                    }
                }

                var locale = stored('nura-games.locale', LOCALES);
                if (locale === null)
                {
                    locale = (navigator.language || 'en').toLowerCase().indexOf('fa') === 0 ? 'fa' : 'en';
                }
                root.setAttribute('lang', locale);
                root.setAttribute('dir', RTL.indexOf(locale) === -1 ? 'ltr' : 'rtl');
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.azeroth" defer></script>
    </body>
</html>
